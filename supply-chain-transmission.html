</style></head><body><div class="wrap"><header><h1>产业链传导实验室</h1><div class="actions"><button id="reset">重置</button><button id="full">全屏投屏</button></div></header><section class="control-panel" aria-labelledby="controlHeading"><h2 id="controlHeading" class="panel-heading">01 · 冲击控制面板</h2><div class="impact"><div><label class="labelrow" for="tariff"><span>新增关税</span><strong class="big" id="tariffLabel">20%</strong></label><input id="tariff" type="range" min="0" max="100" step="1" value="0" aria-label="新增关税百分比"></div><div class="metric"><div>对美出口下降</div><strong class="big numeric" id="exportDrop"></strong></div><div class="metric"><div>电子产品总出口缺口</div><strong class="big numeric" id="gap"></strong><span> 亿元</span></div></div><div class="secondary" id="assumptions"></div></section><div class="workspace"><section id="impactPage" aria-labelledby="resultHeading"><h2 id="resultHeading" class="panel-heading">02 · 模型传导结果</h2><div class="stagebar"><h2 id="round">尚未施加冲击</h2><div class="actions"><button class="primary" id="play">施加冲击并播放传导</button><button id="final">查看全部影响</button></div></div><div class="network"><svg viewBox="0 0 1000 170" preserveAspectRatio="none" role="img" aria-label="三部门需求变化传递关系"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#ffb876"/></marker></defs><g id="flows"></g></svg><div class="nodes"><div class="node"><strong>电子产品</strong></div><div class="node"><strong>原材料</strong></div><div class="node"><strong>服务业</strong></div></div></div><div class="results" id="results"></div><div class="total"><span>三部门总产出 <strong class="value numeric" id="total"></strong> 亿元</span><span class="numeric delta" id="totalDelta"></span></div><div class="large-note" id="narration" aria-live="polite"></div></section><section id="planPage" aria-labelledby="policyHeading"><h2 id="policyHeading" class="panel-heading">03 · 政策方案对比</h2><div class="stagebar"><span class="secondary">共同目标：总产出恢复至 700 亿元</span><button id="restoreOutput">恢复共同产出至 700 亿元</button></div><div class="plans"><article class="plan"><h2>Plan A · 政府采购</h2><p>定向增加电子产品需求 · 基数3亿元</p><label class="labelrow" for="gov"><span>电子产品政府采购增幅</span><strong class="big" id="govLabel"></strong></label><input type="range" id="gov" min="0" max="1400" step="any" value="0"><div class="planresults" id="aResults"></div><div class="plantotal"><span>总产出</span><strong class="numeric" id="aTotal"></strong></div><p class="secondary" id="aDemand"></p><div class="efficiency" id="aEfficiency"></div></article><article class="plan b"><h2>Plan B · 扩大内需</h2><p>增加消费与投资 · 基数172亿元</p><label class="labelrow" for="domestic"><span>消费与投资增幅</span><strong class="big" id="domLabel"></strong></label><input type="range" id="domestic" min="0" max="25" step="any" value="0"><p class="secondary">按课件固定比例分配至三个部门</p><div class="planresults" id="bResults"></div><div class="plantotal"><span>总产出</span><strong class="numeric" id="bTotal"></strong></div><p class="secondary" id="bDemand"></p><div class="efficiency" id="bEfficiency"></div></article></div><div class="large-note" id="conclusion" aria-live="polite"></div></section></div></div><script>

let fitFrame=0;function scheduleFit(){if(fitFrame)cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitPage)}function fitPage(){fitFrame=0;const root=document.querySelector('.wrap');if(!root)return;const w=Math.max(1,window.innerWidth),h=Math.max(1,window.innerHeight);root.style.zoom='1';root.style.width=Math.max(1160,Math.min(1320,w-12))+'px';const naturalW=Math.max(root.scrollWidth,root.offsetWidth),naturalH=Math.max(root.scrollHeight,root.offsetHeight);const scale=Math.min(w/naturalW,(h-8)/naturalH,1.25);root.style.zoom=String(Math.max(.01,scale));}window.addEventListener('resize',scheduleFit);document.addEventListener('fullscreenchange',scheduleFit);if(document.fonts?.ready)document.fonts.ready.then(scheduleFit);
const $=id=>document.getElementById(id),BASE=[300,290,110],Z=[[80,30,30],[120,80,10],[15,10,5]],A=Z.map(r=>r.map((v,j)=>v/BASE[j])),NAMES=['电子产品','原材料','服务业'];let round=0,complete=false,timer=null,hidden=false,settings={share:.15};let allocation=[77/172,47/172,48/172];let comparisonMode="manual";const sum=v=>v.reduce((s,n)=>s+n,0),add=(a,b)=>a.map((v,i)=>v+b[i]),mul=v=>A.map(r=>r.reduce((s,n,j)=>s+n*v[j],0)),f=v=>v.toFixed(2);function solve(d){let m=A.map((r,i)=>r.map((v,j)=>(i===j?1:0)-v).concat(d[i]));for(let c=0;c<3;c++){let p=c;for(let i=c+1;i<3;i++)if(Math.abs(m[i][c])>Math.abs(m[p][c]))p=i;[m[c],m[p]]=[m[p],m[c]];let q=m[c][c];for(let j=c;j<4;j++)m[c][j]/=q;for(let i=0;i<3;i++)if(i!==c){let t=m[i][c];for(let j=c;j<4;j++)m[i][j]-=t*m[c][j]}}return m.map(r=>r[3])}function shock(){const drop=Number($('tariff').value)/100;return {drop,gap:80*settings.share*drop}}function govAmount(){return Number($('gov').value)*3/100}function domAmount(){return Number($('domestic').value)*172/100}function demand(policy='none'){const d=[-shock().gap,0,0];return policy==='gov'?add(d,[govAmount(),0,0]):policy==='domestic'?add(d,allocation.map(v=>v*domAmount())):d}function current(){if(complete)return {x:add(BASE,solve(demand())),last:solve(demand())};let last=[0,0,0],delta=[0,0,0];for(let i=0;i<round;i++){last=i===0?demand():mul(last);delta=add(delta,last)}return {x:add(BASE,delta),last}}
function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent='施加冲击并播放传导'}function changeClass(d){return Math.abs(d)<.005?'unchanged':d>0?'increase':'decrease'}function resultRows(x){return x.map((v,i)=>{const d=v-BASE[i],c=changeClass(d);return `<div class="planrow ${c}"><span>${NAMES[i]}</span><div class="track" style="background:linear-gradient(to right,#34516a 0%,#34516a ${BASE[i]/500*100}%,transparent ${BASE[i]/500*100}%,transparent 100%)"><div class="fill" style="width:${v/500*100}%"></div><div class="mark" style="left:${BASE[i]/500*100}%"></div></div><strong class="numeric">${f(v)}<small>${Math.abs(d)<.005?'恢复基准':(d>0?'+':'')+f(d)+' 亿元'}</small></strong></div>`}).join('')}
function render(){const {drop,gap}=shock(),{x,last}=current();$('tariffLabel').textContent=$('tariff').value+'%';$('exportDrop').textContent=f(drop*100)+'%';$('gap').textContent=f(gap);$('assumptions').textContent='教学线性设定：关税 0–100% 对应对美出口下降 0–100%；对美出口占总出口 15%。';$('round').textContent=complete?'冲击完全传导后（模型均衡）':round===0?'尚未施加冲击':`第 ${round} 轮 · 累计影响`;$('results').innerHTML=x.map((v,i)=>`<div class="result"><h3>${NAMES[i]}</h3><div class="value numeric">${f(v)} <span class="secondary">亿元</span></div><div class="track" style="background:linear-gradient(to right,#34516a 0%,#34516a ${BASE[i]/500*100}%,transparent ${BASE[i]/500*100}%,transparent 100%)"><div class="fill" style="width:${v/500*100}%"></div><div class="mark" style="left:${BASE[i]/500*100}%"></div></div><div class="numeric delta">累计减少 ${f(BASE[i]-v)} 亿元（${f((1-v/BASE[i])*100)}%）</div>${i===0&&round>0||i===0&&complete?`<div class="decomposition numeric"><div class="stack" aria-label="电子产品损失分解"><i style="flex-grow:${gap}">直接冲击<br>${f(gap)} 亿元</i>${Math.max(0,BASE[0]-v-gap)>.00001?`<b style="flex-grow:${Math.max(0,BASE[0]-v-gap)}">间接传导<br>${f(Math.max(0,BASE[0]-v-gap))} 亿元</b>`:``}</div></div>`:(!complete?`<div class="secondary numeric">本轮新增损失 ${f(-last[i])} 亿元</div>`:``)}</div>`).join('');$('total').textContent=f(sum(x));$('totalDelta').textContent=`较基准 ${f(sum(x)-700)} 亿元`;$('narration').textContent=gap===0?'当前设定没有出口需求冲击。':round===0&&!complete?'先判断：电子产品出口订单减少，哪些部门也会受到影响？':complete?'全部影响包含直接冲击和多轮间接传导。':round===1?'首轮：出口订单减少，电子产品产出首先下降。':round===2?'电子产品减少采购，原材料和服务业订单随之减少。':'各部门继续减少采购，影响沿投入关系反馈并累加。';const paths=round<2&&!complete?'':`<path class="pulse" d="M290 58L386 58M290 95Q500 150 710 95" fill="none" stroke="#ffb876" stroke-width="5" marker-end="url(#arrow)"/>`+((round>2||complete)?`<path class="pulse" d="M386 105L290 105M614 58L710 58M710 120Q500 165 290 120" fill="none" stroke="#ffb876" stroke-width="4" marker-end="url(#arrow)"/>`:'');$('flows').innerHTML=gap>0?paths:'';document.querySelectorAll('.node').forEach((n,i)=>n.classList.toggle('hit',Math.abs(last[i])>.0001));$('govLabel').textContent=f(Number($('gov').value))+'%（新增'+f(govAmount())+'亿元）';$('domLabel').textContent=f(Number($('domestic').value))+'%（新增'+f(domAmount())+'亿元）';let ax=add(BASE,solve(demand('gov'))),bx=add(BASE,solve(demand('domestic')));$('aResults').innerHTML=resultRows(ax);$('bResults').innerHTML=resultRows(bx);$('aTotal').textContent=f(sum(ax))+' 亿元';$('bTotal').textContent=f(sum(bx))+' 亿元';$('aTotal').className='numeric '+changeClass(sum(ax)-700);$('bTotal').className='numeric '+changeClass(sum(bx)-700);$('aDemand').textContent=`新增最终需求 ${f(govAmount())} 亿元`;$('bDemand').textContent=`新增最终需求 ${f(domAmount())} 亿元`;for(const [id,p,m] of [['aEfficiency','gov',govAmount()],['bEfficiency','domestic',domAmount()]]){const gain=solve(p==='gov'?[m,0,0]:allocation.map(v=>v*m));$(id).textContent=m===0?'新增金额为 0，效率指标暂不计算。':`每 1 亿元新增需求：总产出回升 ${f(sum(gain)/m)} 亿元，电子行业回补 ${f(gain[0]/m)} 亿元。`}$('conclusion').textContent='方案 A 定向支持电子行业；方案 B 带动原材料与服务业。比较恢复相同总产出所需的需求增幅，并观察各部门的恢复差异。';scheduleFit();}
function alignOutput(){const loss=-sum(solve(demand()));$('gov').value=loss/sum(solve([1,0,0]))/3*100;$('domestic').value=loss/sum(solve(allocation))/172*100;}
function restart(){stop();round=0;complete=false;render()}function next(){if(complete)return;round++;if(round>=18){complete=true;stop()}render()}$('tariff').oninput=()=>{restart()};$('gov').oninput=()=>{comparisonMode='manual';render()};$('domestic').oninput=()=>{comparisonMode='manual';render()};$('final').onclick=()=>{stop();complete=true;render()};$('play').onclick=()=>{if(timer){stop();return}if(complete){round=0;complete=false}next();if(!complete){timer=setInterval(next,1300);$('play').textContent='暂停传导'}};$('restoreOutput').onclick=()=>{alignOutput();render()};$('reset').onclick=()=>{comparisonMode='manual';$('tariff').value=0;$('gov').value=0;$('domestic').value=0;settings={share:.15};hidden=false;allocation=[77/172,47/172,48/172];restart()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('full').textContent='可按 F11 全屏'}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'退出全屏':'全屏投屏'});render();
</script></body></html>
